<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frugulletty</title>
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbw2RMtXm8rCiJ6gc_MxfGwjIeaS_csteChvST4dFaT_0EeKKMnMdnE4u3CtpwZtlydU/exec">
  <link rel="canonical" href="https://script.google.com/macros/s/AKfycbw2RMtXm8rCiJ6gc_MxfGwjIeaS_csteChvST4dFaT_0EeKKMnMdnE4u3CtpwZtlydU/exec">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f9fafb;
      color: #1f2937;
      text-align: center;
    }

    .container {
      padding: 2rem;
    }

    .spinner {
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top: 3px solid #111827;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Redirigiendo a Frugulletty...</p>
    <p><small>Si no se redirige automáticamente, <a href="https://script.google.com/macros/s/AKfycbw2RMtXm8rCiJ6gc_MxfGwjIeaS_csteChvST4dFaT_0EeKKMnMdnE4u3CtpwZtlydU/exec">haz clic aquí</a>.</small></p>
  </div>
  <script>
    window.location.replace("https://script.google.com/macros/s/AKfycbw2RMtXm8rCiJ6gc_MxfGwjIeaS_csteChvST4dFaT_0EeKKMnMdnE4u3CtpwZtlydU/exec");
  </script>
</body>

</html>
